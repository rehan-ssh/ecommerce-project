spring.application.name=ApiGateway
server.port=8085

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/products/**
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ProductService


spring.cloud.gateway.server.webmvc.routes[1].id=user-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://UserService

management.endpoints.web.exposure.include=*